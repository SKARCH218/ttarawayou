<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>트레빗 Travit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: #e8ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, sans-serif;
        }
        /* 폰 프레임 — 앱 화면이 이 안에 그대로 렌더링된다 */
        #trevitApp {
            position: relative;
            width: min(430px, 100vw);
            height: min(100dvh, 932px);
            background: #ffffff;
            overflow: hidden;
        }
        @media (min-width: 480px) {
            #trevitApp {
                border-radius: 24px;
                box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
                height: min(92dvh, 932px);
            }
        }
        /* 로딩 중 표시 — absolute로 띄워야 캔버스가 밀려나지 않는다 (캔버스가 위에 그려져 가려짐) */
        #trevitApp::before {
            content: "트레빗 불러오는 중…";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8a9499;
            font-size: 15px;
        }
    </style>
</head>
<body>
<div id="trevitApp"></div>
<script>
    // 창 크기가 바뀌면 Compose 는 window resize 순간에 프레임 크기를 재는데, 그때는 프레임(dvh 기준)이
    // 아직 새 크기로 바뀌기 전이라 옛 크기로 그려져 화면 아래가 잘렸다(창 조절·개발자도구·모바일 주소창).
    // 프레임 크기가 실제로 바뀐 뒤에 resize 를 한 번 더 알려 다시 재게 한다.
    (function () {
        var box = document.getElementById("trevitApp");
        var ping = function () { window.dispatchEvent(new Event("resize")); };
        var timer = 0;
        var later = function () { clearTimeout(timer); timer = setTimeout(ping, 250); };
        // 1) 실제 창 크기 변경(사용자·브라우저가 낸 것만 — 우리가 보낸 가짜 resize 에는 반응하지 않아 무한 반복이 없다)
        window.addEventListener("resize", function (e) { if (e.isTrusted) later(); });
        // 2) 모바일 주소창이 접히고 펴질 때
        if (window.visualViewport) window.visualViewport.addEventListener("resize", later);
        // 3) 프레임 크기가 실제로 바뀐 순간 (화면이 그려지는 동안에만 동작)
        if (window.ResizeObserver) {
            var last = "";
            new ResizeObserver(function () {
                var r = box.getBoundingClientRect();
                var size = Math.round(r.width) + "x" + Math.round(r.height);
                if (size === last) return;
                last = size;
                later();
            }).observe(box);
        }
        // 4) 안전장치: 이벤트를 놓쳐도 1초마다 프레임과 앱 캔버스 높이를 비교해 어긋나 있으면 다시 맞춘다
        setInterval(function () {
            var canvas = box.shadowRoot && box.shadowRoot.querySelector("canvas");
            if (!canvas) return;
            var diff = Math.abs(canvas.getBoundingClientRect().height - box.getBoundingClientRect().height);
            if (diff > 1) ping();
        }, 1000);
    })();
</script>
<script type="application/javascript" src="trevit-web.js"></script>
</body>
</html>
