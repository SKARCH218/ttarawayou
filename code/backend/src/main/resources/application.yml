server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  # node2 로컬에서 도는 PostgreSQL 18. 백엔드와 같은 서버라 기본값은 localhost.
  # 예전엔 H2 인메모리라 재시작하면 데이터가 다 날아갔다 — 이제 재시작해도 남는다.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travit}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:travit}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 기존 테이블은 손대지 않고 엔티티에 없는 컬럼/테이블만 채운다.
      # PostgreSQL은 재시작해도 데이터가 남으므로 H2 시절의 create-drop 은 쓰면 안 된다.
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  # 회원가입 인증메일 발송용 SMTP.
  # MAIL_HOST가 비어 있으면 발송하지 않고 인증코드를 서버 로그에 출력한다(개발·시연용).
  # Gmail을 쓸 경우: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587,
  #   MAIL_USERNAME=계정@gmail.com, MAIL_PASSWORD=앱 비밀번호(16자리, 일반 비밀번호 아님)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

trevit:
  mail:
    # 받는 사람에게 보이는 발신자. Gmail은 실제 계정 주소로 덮어써서 나갈 수 있다
    from: ${MAIL_FROM:트레빗 <no-reply@trevit.app>}

# 구글 로그인 (Google Identity Services).
# Google Cloud 콘솔 → 사용자 인증 정보 → OAuth 클라이언트 ID(웹)에서 발급받고
# 승인된 자바스크립트 원본에 접속 주소를 등록해야 한다.
# 값이 비어 있으면 로그인 화면에 구글 버튼이 아예 뜨지 않는다.
google:
  client-id: ${GOOGLE_CLIENT_ID:}

# ODsay 대중교통 API 키 (없으면 거리 기반 추정으로 자동 폴백)
odsay:
  api-key: ${ODSAY_API_KEY:}

osrm:
  base-url: https://router.project-osrm.org

# 공공데이터포털(data.go.kr) 인증키 — 국토교통부(TAGO) 버스노선/도착정보
# 키가 없으면 자동 폴백
datago:
  api-key: ${DATA_GO_KR_API_KEY:}

# SK open API (TMAP) — 보행자/대중교통 길찾기 + 전국 POI(관광지·숙소·음식점)
# 키가 없거나 쿼터 초과(429)면 충남·대전 시드 데이터로 자동 폴백
tmap:
  app-key: ${TMAP_APP_KEY:}

# LM Studio 로컬 AI (OpenAI 호환 API). 꺼져 있거나 실패하면 휴리스틱 알고리즘으로 자동 폴백
lmstudio:
  base-url: ${LMSTUDIO_BASE_URL:http://127.0.0.1:1234/v1}
  model: ${LMSTUDIO_MODEL:google/gemma-4-26b-a4b-qat}
  enabled: ${LMSTUDIO_ENABLED:true}
  # AI 응답이 이 시간을 넘기면 휴리스틱 폴백 (느린 로컬 모델은 값을 늘릴 것)
  timeout-ms: ${LMSTUDIO_TIMEOUT_MS:20000}
  # LM Studio 서버의 "Require API key" 설정을 켰다면 여기에 그 토큰을 넣는다.
  # 비어 있으면 Authorization 헤더를 아예 보내지 않는다 (기존과 동일하게 동작).
  api-key: ${LMSTUDIO_API_KEY:}

# 관리자 페이지(/admin) 접근 토큰. 비어 있으면(기본값) /api/admin/** 전체가 503으로 막힌다 —
# 값을 넣어야만 켜지는 안전한 기본값이다. 절대 저장소에 실제 값을 커밋하지 말 것.
admin:
  token: ${ADMIN_TOKEN:}
