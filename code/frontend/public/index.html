<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>트레빗 — 여행 만들기</title>
  <link rel="icon" href="brand/travit-symbol.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/ogq-tokens.css?v=31" />
  <link rel="stylesheet" href="css/style.css?v=31" />
</head>
<body data-auth="required">
  <div class="phone">
    <div class="app">
      <!-- 인트로: 로고가 뜬 뒤 자동으로 사라진다 (탭하면 즉시 스킵) -->
      <div class="intro" id="intro">
        <img class="intro-symbol" src="brand/travit-symbol.svg" alt="트레빗" />
        <img class="intro-wordmark" src="brand/travit-wordmark.svg" alt="Travit" />
        <p class="intro-tagline">AI가 여행 계획을 대신 세워드려요</p>
      </div>

      <div class="screen">
        <!-- 로그인한 닉네임 / 로그아웃 — 내용은 common.js가 채운다 -->
        <div class="auth-chip" id="authChip"></div>
        <img class="brand-logo" src="brand/travit-logo-full.svg" alt="트레빗" />
        <h1 class="title">어디로 떠나볼까요?</h1>
        <p class="subtitle">장소는 도착 전까지 비밀</p>

        <div class="card">
          <div class="field">
            <label>지역</label>
            <select id="regionSelect" class="ds-select">
              <option>서울</option><option>인천</option><option>강화</option><option>수원</option>
              <option>가평</option><option>양평</option><option>파주</option><option>포천</option>
              <option>용인</option><option>남양주</option><option>이천</option><option>여주</option>
              <option>화성</option><option>시흥</option><option>과천</option><option>광주</option>
              <option>김포</option><option>안산</option>
            </select>
          </div>

          <div class="field">
            <label>예산</label>
            <div class="budget-display">
              <span class="budget-num" id="budgetValue" title="눌러서 직접 입력">300,000</span>
              <span class="unit-inline">토큰</span>
            </div>
            <input type="range" class="budget-slider" id="budgetSlider"
                   min="50000" max="500000" step="10000" value="300000" />
            <div class="wallet-row">
              <span>보유 <b id="walletBalance">…</b></span>
              <button type="button" class="charge-btn" id="chargeBtn">충전</button>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label>기간</label>
              <div class="stepper">
                <button type="button" data-step="days" data-delta="-1"><img class="ds-icon" src="icons/Remove_Minus.png" alt="−" /></button>
                <div class="stepper-value"><span id="daysValue">2</span><small>일</small></div>
                <button type="button" data-step="days" data-delta="1"><img class="ds-icon" src="icons/Add_Plus.png" alt="＋" /></button>
              </div>
            </div>
            <div class="field">
              <label>인원</label>
              <div class="stepper">
                <button type="button" data-step="people" data-delta="-1"><img class="ds-icon" src="icons/Remove_Minus.png" alt="−" /></button>
                <div class="stepper-value"><span id="peopleValue">1</span><small>명</small></div>
                <button type="button" data-step="people" data-delta="1"><img class="ds-icon" src="icons/Add_Plus.png" alt="＋" /></button>
              </div>
            </div>
          </div>
        </div>

        <div class="error-box" id="errorBox"></div>

        <div style="margin-top:16px;">
          <button class="btn-primary" id="nextBtn">다음</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js?v=31"></script>
  <script src="js/setup.js?v=31"></script>
</body>
</html>
