<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>트레빗 — 로그인</title>
  <link rel="icon" href="brand/travit-symbol.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/ogq-tokens.css?v=31" />
  <link rel="stylesheet" href="css/style.css?v=31" />
</head>
<body>
  <div class="phone">
    <div class="app">
      <div class="auth-screen">
        <img class="brand-logo" src="brand/travit-symbol.svg" alt="트레빗" />
        <h1 class="title">다시 만나서 반가워요</h1>
        <p class="subtitle">오늘은 어디로 떠나볼까요?</p>

        <form class="card" id="loginForm" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <div class="input-wrap">
              <input class="auth-input" type="email" id="email" name="email"
                     inputmode="email" autocomplete="email" placeholder="travit@example.com" />
            </div>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <div class="input-wrap">
              <input class="auth-input has-toggle" type="password" id="password" name="password"
                     autocomplete="current-password" placeholder="비밀번호" />
              <button type="button" class="pw-toggle" data-pw-toggle="password" aria-label="비밀번호 표시">
                <img class="ds-icon" src="icons/Show.png" alt="" />
              </button>
            </div>
          </div>

          <div class="error-box" id="errorBox"></div>

          <div style="margin-top:16px;">
            <button type="submit" class="btn-primary" id="submitBtn">로그인</button>
          </div>
        </form>

        <!-- 구글 클라이언트 ID가 설정돼 있을 때만 auth.js가 채운다 -->
        <div class="social-block" id="socialBlock" hidden>
          <div class="auth-divider"><span>또는</span></div>
          <div id="googleBtn"></div>
        </div>

        <p class="auth-switch">아직 계정이 없나요?<a href="signup.html">회원가입</a></p>
      </div>
    </div>
  </div>

  <script src="js/common.js?v=31"></script>
  <script src="js/auth.js?v=31"></script>
</body>
</html>
