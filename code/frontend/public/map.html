<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>트레빗 — 길 따라가기</title>
  <link rel="icon" href="brand/travit-symbol.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/ogq-tokens.css?v=30" />
  <link rel="stylesheet" href="css/style.css?v=30" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="phone">
    <div class="app">
      <div class="map-shell">
        <div id="map"></div>
        <!-- 지도 입력(드래그·휠·핀치) 완전 차단 오버레이 -->
        <div id="mapLock" style="position:absolute; inset:0; z-index:500;"></div>

        <div class="map-topbar">
          <button class="map-back" id="backBtn"><img class="ds-icon" src="icons/Chevron_Left.png" alt="뒤로" /></button>
          <div class="map-status">
            <b id="statusTitle">Day ? 여정</b>
            <span id="statusSub">위치를 찾는 중…</span>
          </div>
        </div>

        <div class="progress-pill" id="progressPill">비밀 장소 0 / 0</div>
        <div class="progress-pill" id="busArrival" style="top: 142px; color: var(--ogq-color-semantic-warning-dark); display: none;"></div>
        <div class="offroute-banner" id="offrouteBanner">⚠️ 길에서 벗어났어요! 표시된 길로 돌아가 주세요</div>

        <div class="mystery-hint" id="mysteryHint">
          <span style="font-size:20px;">🧭</span>
          <span><b>보라색 길</b>을 따라가세요</span>
        </div>

        <div class="reveal-overlay" id="revealOverlay">
          <div class="reveal-card">
            <div class="emoji" id="revealEmoji">🎉</div>
            <div class="reveal-label" id="revealLabel">도착! 이곳은…</div>
            <h2 id="revealName">???</h2>
            <p class="addr" id="revealAddr"></p>
            <p class="desc" id="revealDesc"></p>
            <div class="meta" id="revealMeta"></div>
            <button class="btn-primary" id="revealNext">다음 비밀 장소로 →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/common.js?v=30"></script>
  <script src="js/map.js?v=30"></script>
</body>
</html>
