<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>트레빗 — 플랜</title>
  <link rel="stylesheet" href="css/ogq-tokens.css?v=22" />
  <link rel="stylesheet" href="css/style.css?v=22" />
</head>
<body>
  <div class="phone">
    <div class="app">
      <div class="screen">
        <p class="brand">Trevit</p>
        <div class="mystery-badge"><img src="icons/Gift.png" alt="" style="width:34px; height:34px; filter:brightness(0) invert(1);" /></div>
        <h1 class="title">플랜 완성</h1>
        <p class="subtitle">장소는 도착할 때 공개돼요</p>
        <p class="subtitle" id="plannerBadge" style="margin-top:6px; font-size:12px; color:var(--ogq-color-mono-500);"></p>

        <div class="card">
          <div class="cost-row">
            <span class="k">총 예산</span>
            <span class="v" id="budgetTotal">—</span>
          </div>
          <div class="cost-row">
            <span class="k">예상 총비용</span>
            <span class="v big" id="totalCost">—</span>
          </div>
          <div class="cost-row">
            <span class="k">남는 예산</span>
            <span class="v accent" id="remaining">—</span>
          </div>
          <div class="cost-row">
            <span class="k">🪙 남은 토큰</span>
            <span class="v" id="tokenBalance" style="color:var(--ogq-color-semantic-warning-default);">—</span>
          </div>
        </div>

        <div class="card bar-group" id="barGroup">
          <div style="font-size:13px; font-weight:700; color:var(--ogq-color-mono-700);">예산 배분 사용률</div>
        </div>

        <label class="card" id="demoToggleCard"
               style="display:flex; align-items:center; gap:10px; cursor:pointer; padding:12px 16px;">
          <input type="checkbox" id="demoCheck" style="width:18px; height:18px; accent-color:#703fe4;" />
          <span style="font-size:13px;"><b>데모 모드</b> — GPS 없이 자동 이동</span>
        </label>

        <div class="day-list" id="dayList"></div>

        <button class="btn-ghost" id="resetBtn" style="margin-top:18px;">← 예산 다시 입력하기</button>
      </div>
    </div>
  </div>

  <script src="js/common.js?v=22"></script>
  <script src="js/plan.js?v=22"></script>
</body>
</html>
