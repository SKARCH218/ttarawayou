<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>트레빗 — 회원가입</title>
  <link rel="icon" href="brand/travit-symbol.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/ogq-tokens.css?v=31" />
  <link rel="stylesheet" href="css/style.css?v=31" />
</head>
<body>
  <div class="phone">
    <div class="app">
      <div class="auth-screen">
        <img class="brand-logo" src="brand/travit-symbol.svg" alt="트레빗" />
        <h1 class="title">떠날 준비 되셨나요?</h1>
        <p class="subtitle">30초면 가입 끝 — 바로 여행을 만들 수 있어요</p>

        <form class="card" id="signupForm" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <div class="verify-row">
              <div class="input-wrap">
                <input class="auth-input" type="email" id="email" name="email"
                       inputmode="email" autocomplete="email" placeholder="travit@example.com" />
              </div>
              <button type="button" class="verify-btn" id="sendCodeBtn">인증요청</button>
            </div>
            <p class="field-hint" id="emailHint">인증번호를 받을 주소예요</p>
          </div>

          <!-- 인증요청을 눌러야 나타난다 -->
          <div class="field" id="codeField" hidden>
            <label for="code">인증번호</label>
            <div class="verify-row">
              <div class="input-wrap">
                <input class="auth-input code-input" type="text" id="code" name="code"
                       inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" />
                <span class="code-timer" id="codeTimer"></span>
              </div>
              <button type="button" class="verify-btn" id="verifyCodeBtn">확인</button>
            </div>
            <p class="field-hint" id="codeHint"></p>
          </div>

          <div class="field">
            <label for="nickname">닉네임</label>
            <div class="input-wrap">
              <input class="auth-input" type="text" id="nickname" name="nickname"
                     autocomplete="nickname" maxlength="12" placeholder="여행자" />
            </div>
            <p class="field-hint" id="nicknameHint">2~12자 — 여행 화면에서 이렇게 불러 드려요</p>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <div class="input-wrap">
              <input class="auth-input has-toggle" type="password" id="password" name="password"
                     autocomplete="new-password" placeholder="영문+숫자 8자 이상" />
              <button type="button" class="pw-toggle" data-pw-toggle="password" aria-label="비밀번호 표시">
                <img class="ds-icon" src="icons/Show.png" alt="" />
              </button>
            </div>
            <div class="pw-meter" id="pwMeter"><i></i><i></i><i></i></div>
            <p class="field-hint" id="passwordHint">영문과 숫자를 섞어 8자 이상</p>
          </div>

          <div class="field">
            <label for="passwordConfirm">비밀번호 확인</label>
            <div class="input-wrap">
              <input class="auth-input has-toggle" type="password" id="passwordConfirm" name="passwordConfirm"
                     autocomplete="new-password" placeholder="한 번 더 입력" />
              <button type="button" class="pw-toggle" data-pw-toggle="passwordConfirm" aria-label="비밀번호 표시">
                <img class="ds-icon" src="icons/Show.png" alt="" />
              </button>
            </div>
            <p class="field-hint" id="passwordConfirmHint"></p>
          </div>

          <label class="auth-terms">
            <input type="checkbox" id="agree" />
            <span>서비스 이용약관과 개인정보 처리방침에 동의합니다. 위치정보는 여행 안내 중에만 쓰이고 저장하지 않아요.</span>
          </label>

          <div class="error-box" id="errorBox"></div>

          <div style="margin-top:16px;">
            <button type="submit" class="btn-primary" id="submitBtn">가입하고 시작하기</button>
          </div>
        </form>

        <!-- 구글 클라이언트 ID가 설정돼 있을 때만 auth.js가 채운다 -->
        <div class="social-block" id="socialBlock" hidden>
          <div class="auth-divider"><span>또는</span></div>
          <div id="googleBtn"></div>
        </div>

        <p class="auth-switch">이미 계정이 있나요?<a href="login.html">로그인</a></p>
      </div>
    </div>
  </div>

  <script src="js/common.js?v=31"></script>
  <script src="js/auth.js?v=31"></script>
</body>
</html>
