<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🛠️ 미스터리 트립 — 디버깅 (3030)</title>
  <link rel="stylesheet" href="css/style.css?v=20" />
  <link rel="stylesheet" href="css/debug.css?v=20" />
  <script>
    // map.js보다 먼저 실행: 디버그 훅 활성화 + 실제 GPS 차단(시뮬레이션이 위치를 공급)
    window.__MT_DEBUG__ = true;
    navigator.geolocation.watchPosition = function (ok, err) {
      if (err) setTimeout(() => err({ code: 1, PERMISSION_DENIED: 1 }), 100);
      return 0;
    };
  </script>
</head>
<body>
  <div class="phone">
    <div class="app">
      <div class="map-shell">
        <div id="map"></div>
        <!-- 지도 입력(드래그·휠·핀치) 완전 차단 오버레이 -->
        <div id="mapLock" style="position:absolute; inset:0; z-index:500;"></div>

        <div class="map-topbar">
          <button class="map-back" id="backBtn">‹</button>
          <div class="map-status">
            <b id="statusTitle">Day ? 미스터리 여정</b>
            <span id="statusSub">위치를 찾는 중…</span>
          </div>
        </div>

        <div class="progress-pill" id="progressPill">비밀 장소 0 / 0</div>
        <div class="progress-pill" id="busArrival" style="top: 142px; color: #ffd479; display: none;"></div>
        <div class="offroute-banner" id="offrouteBanner">⚠️ 길에서 벗어났어요! 표시된 길로 돌아가 주세요</div>

        <div class="mystery-hint" id="mysteryHint">
          <span style="font-size:20px;">🧭</span>
          <span>목적지는 비밀! 발밑에 나타나는 <b>보라색 길</b>을 따라가면
          어딘가에 도착하게 됩니다…</span>
        </div>

        <div class="reveal-overlay" id="revealOverlay">
          <div class="reveal-card">
            <div class="emoji" id="revealEmoji">🎉</div>
            <div class="reveal-label" id="revealLabel">도착! 이곳은…</div>
            <h2 id="revealName">???</h2>
            <p class="addr" id="revealAddr"></p>
            <p class="desc" id="revealDesc"></p>
            <div class="meta" id="revealMeta"></div>
            <button class="btn-primary" id="revealNext">다음 비밀 장소로 →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 폰 프레임 오른쪽 디버깅 사이드 패널 -->
  <aside class="dbg-side" id="dbgSide">
    <div class="dbg-side-head">
      <b>🛠️ 디버깅 — Day <span id="dbgDay">?</span></b>
      <span style="display:flex; gap:8px; align-items:center;">
        <span class="dbg-speed" id="dbgSpeed">
          <button data-mult="1" class="on">×1</button><button data-mult="2">×2</button><button data-mult="4">×4</button><button data-mult="8">×8</button>
        </span>
        <span class="dbg-sim" id="dbgClock"
              style="color:#ffd479; border-color:rgba(255,212,121,.4); background:rgba(255,212,121,.1);">🕐 --:--</span>
        <span class="dbg-sim" id="dbgSim">▶ 10m/s 자동 이동</span>
      </span>
    </div>
    <div class="dbg-side-body" id="dbgBody">디버그 훅 대기 중…</div>
  </aside>

  <script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey=YOUR_TMAP_APP_KEY"></script>
  <script src="js/common.js?v=20"></script>
  <script src="js/map.js?v=20"></script>
  <script src="js/debug-map.js?v=20"></script>
</body>
</html>
