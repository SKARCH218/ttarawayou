# 집 VPN 서버(112.166.208.166)의 리버스 프록시
# 공유기에서 80/443 을 이 서버로 포트포워딩한 뒤, 여기서 VPN 터널 너머 node2 로 넘깁니다.
#
#   sudo cp nginx-trevit.conf /etc/nginx/sites-available/trevit
#   sudo ln -s /etc/nginx/sites-available/trevit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: 아래 한 줄이면 인증서까지 자동 설정됩니다 (이 파일에 443 블록도 자동으로 추가됨).
#   sudo certbot --nginx -d travit.p-e.kr
# ※ HTTPS 가 없으면 브라우저가 위치 권한(GPS)을 막습니다 — 배포_가이드의 주의사항 참고
#
# ※ 웹 프론트(code/frontend)는 제거되어 앱(Android)만 남았습니다.
#   이 서버는 API 전용이므로 모든 요청을 백엔드로 프록시합니다.

upstream trevit_backend {
    server 10.8.2.5:9090;   # Kotlin Spring (node2)
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name travit.p-e.kr;

    client_max_body_size 8m;

    # 공통 프록시 헤더
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location / {
        proxy_pass http://trevit_backend;

        # 플랜 생성은 LLM(node1)을 거쳐 수십 초가 걸릴 수 있습니다.
        # 기본값(60s)이면 끊기므로 넉넉히 잡습니다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
