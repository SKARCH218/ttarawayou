# 집 VPN 서버(112.166.208.166)의 리버스 프록시
# 공유기에서 80/443 을 이 서버로 포트포워딩한 뒤, 여기서 VPN 터널 너머 node2 로 넘깁니다.
#
#   sudo cp nginx-trevit.conf /etc/nginx/sites-available/trevit
#   sudo ln -s /etc/nginx/sites-available/trevit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: 도메인을 준비한 뒤 아래 한 줄이면 인증서까지 자동 설정됩니다.
#   sudo certbot --nginx -d <도메인>
# ※ HTTPS 가 없으면 브라우저가 위치 권한(GPS)을 막습니다 — 배포_가이드의 주의사항 참고

# node2(10.8.2.5) 에 프론트·백엔드가 함께 떠 있고 서로 로컬로 통신합니다.
upstream trevit_frontend {
    server 10.8.2.5:3000;   # Express 정적 서버
    keepalive 16;
}
upstream trevit_backend {
    server 10.8.2.5:9090;   # Kotlin Spring
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;          # 도메인이 생기면 여기에 적습니다

    client_max_body_size 8m;

    # 공통 프록시 헤더
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ── API 는 백엔드로 ─────────────────────────────────────
    # 프론트는 프록시 뒤(80포트)에서 같은 오리진으로 /api 를 호출합니다.
    # (js/common.js: 3000·3030 포트로 직접 접속할 때만 백엔드 포트를 붙임)
    location /api/ {
        proxy_pass http://trevit_backend;

        # 플랜 생성은 LLM(node1)을 거쳐 수십 초가 걸릴 수 있습니다.
        # 기본값(60s)이면 끊기므로 넉넉히 잡습니다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── 그 외 정적 화면은 프론트로 ───────────────────────────
    location / {
        proxy_pass http://trevit_frontend;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}

# ─────────────────────────────────────────────────────────
# 참고: 프론트 서버를 따로 띄우지 않고 백엔드 jar 하나로 운영한다면
# (jar 가 정적 웹까지 서빙합니다) 위 두 location 을 지우고 아래 한 덩어리만 쓰면 됩니다.
#
#   location / {
#       proxy_pass http://trevit_backend;
#       proxy_connect_timeout 10s;
#       proxy_send_timeout    120s;
#       proxy_read_timeout    120s;
#   }
