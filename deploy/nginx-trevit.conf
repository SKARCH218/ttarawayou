# 집 VPN 서버(112.166.208.166)의 리버스 프록시
# 공유기에서 80/443 을 이 서버로 포트포워딩한 뒤, 여기서 VPN 터널 너머 node2 로 넘깁니다.
#
#   sudo cp nginx-trevit.conf /etc/nginx/sites-available/trevit
#   sudo ln -s /etc/nginx/sites-available/trevit /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: 도메인을 준비한 뒤 아래 한 줄이면 인증서까지 자동 설정됩니다.
#   sudo certbot --nginx -d <도메인>
# ※ HTTPS 가 없으면 브라우저가 위치 권한(GPS)을 막습니다 — 배포_가이드의 주의사항 참고

upstream trevit_backend {
    # 학교 node2 의 VPN IP. 백엔드가 웹 데모까지 함께 서빙합니다.
    server 10.8.1.102:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;          # 도메인이 생기면 여기에 적습니다

    # 업로드는 없지만 여유를 둡니다
    client_max_body_size 8m;

    location / {
        proxy_pass http://trevit_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 플랜 생성은 LLM 을 거쳐 수십 초가 걸릴 수 있습니다.
        # 기본값(60s)이면 끊기므로 넉넉히 잡습니다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 헬스체크 — 감시 도구에서 이 경로를 찔러 서비스 생존을 확인합니다
    location = /api/wallet {
        proxy_pass http://trevit_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}
