<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>따라와유 — Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream:     #F5E6D3;
    --coral:     #E07856;
    --bg:        #FAF7F2;
    --navy:      #1F2937;
    --grey:      #6B7280;
    --accent-blue: #2BB3FF;
  }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #E8E8E8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  /* ── 폰 컨테이너 ── */
  .screen {
    width: 390px;
    height: 844px;
    border-radius: 44px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    box-shadow:
      0 24px 60px rgba(0,0,0,.22),
      0 8px 20px rgba(0,0,0,.10);
    /* 부드러운 베이지 그라데이션 배경 */
    background:
      radial-gradient(circle at 50% 38%, #FFFFFF 0%, var(--bg) 55%, #F0E9DE 100%);
  }

  /* 상태바 */
  .statusbar {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    position: relative;
    z-index: 3;
  }
  .sb-icons { display: flex; gap: 6px; align-items: center; font-size: 12px; }

  /* 배경 장식 — 미묘한 원형 글로우 */
  .glow {
    position: absolute;
    width: 540px; height: 540px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(43,179,255,0.10) 0%, rgba(43,179,255,0) 65%);
    top: 50%; left: 50%;
    transform: translate(-50%, -55%);
    pointer-events: none;
    z-index: 1;
  }

  /* 메인 콘텐츠 — 중앙 정렬 */
  .center {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    padding: 0 40px;
  }

  /* 로고 컨테이너 */
  .logo-wrap {
    position: relative;
    width: 280px; height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    animation: float 3.4s ease-in-out infinite;
  }

  /* 로고 이미지 + 그림자 */
  .logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter:
      drop-shadow(0 12px 24px rgba(31,41,55,0.18))
      drop-shadow(0 6px 12px rgba(43,179,255,0.18))
      drop-shadow(0 2px 4px rgba(31,41,55,0.10));
  }

  /* 로고 아래 바닥 그림자 (타원형) */
  .logo-shadow {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px; height: 22px;
    background: radial-gradient(ellipse, rgba(31,41,55,0.18) 0%, rgba(31,41,55,0) 70%);
    border-radius: 50%;
    z-index: -1;
    animation: shadowPulse 3.4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scale(1);   opacity: 0.9; }
    50%      { transform: translateX(-50%) scale(0.85); opacity: 0.55; }
  }

  /* 태그라인 */
  .tagline {
    font-size: 17px;
    font-weight: 500;
    color: var(--grey);
    text-align: center;
    letter-spacing: 0.5px;
    margin-top: 8px;
  }
  .tagline strong {
    color: var(--coral);
    font-weight: 700;
  }

  /* 하단 로딩 인디케이터 */
  .loader {
    position: absolute;
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 2;
  }
  .loader span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--coral);
    opacity: 0.35;
    animation: dot 1.4s ease-in-out infinite;
  }
  .loader span:nth-child(2) { animation-delay: 0.18s; }
  .loader span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes dot {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40%           { opacity: 1;    transform: scale(1.15); }
  }

  /* 하단 카피라이트 */
  .footer {
    position: absolute;
    bottom: 56px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--grey);
    letter-spacing: 1px;
    z-index: 2;
    opacity: 0.7;
  }

  /* 홈 인디케이터 */
  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    background: var(--navy);
    border-radius: 3px;
    opacity: 0.35;
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="screen">
    <!-- 상태바 -->
    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-icons">●●●● 5G 100%</span>
    </div>

    <!-- 배경 글로우 -->
    <div class="glow"></div>

    <!-- 중앙 로고 -->
    <div class="center">
      <div class="logo-wrap">
        <div class="logo-shadow"></div>
        <img class="logo" src="../icon.png" alt="따라와유 로고">
      </div>
      <p class="tagline">
        <strong>AI가 정해주는</strong> 충남 여행
      </p>
    </div>

    <!-- 로딩 인디케이터 -->
    <div class="loader">
      <span></span><span></span><span></span>
    </div>

    <!-- 푸터 -->
    <div class="footer">TARAWAYOU · v1.0</div>

    <!-- 홈 인디케이터 -->
    <div class="home-indicator"></div>
  </div>
</body>
</html>
