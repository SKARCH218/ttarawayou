<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>미스터리 트립 — 길 따라가기</title>
  <link rel="stylesheet" href="css/style.css?v=20" />
</head>
<body>
  <div class="phone">
    <div class="app">
      <div class="map-shell">
        <div id="map"></div>
        <!-- 지도 입력(드래그·휠·핀치) 완전 차단 오버레이 -->
        <div id="mapLock" style="position:absolute; inset:0; z-index:500;"></div>

        <div class="map-topbar">
          <button class="map-back" id="backBtn">‹</button>
          <div class="map-status">
            <b id="statusTitle">Day ? 미스터리 여정</b>
            <span id="statusSub">위치를 찾는 중…</span>
          </div>
        </div>

        <div class="progress-pill" id="progressPill">비밀 장소 0 / 0</div>
        <div class="progress-pill" id="busArrival" style="top: 142px; color: #ffd479; display: none;"></div>
        <div class="offroute-banner" id="offrouteBanner">⚠️ 길에서 벗어났어요! 표시된 길로 돌아가 주세요</div>

        <div class="mystery-hint" id="mysteryHint">
          <span style="font-size:20px;">🧭</span>
          <span>목적지는 비밀! 발밑에 나타나는 <b>보라색 길</b>을 따라가면
          어딘가에 도착하게 됩니다…</span>
        </div>

        <div class="reveal-overlay" id="revealOverlay">
          <div class="reveal-card">
            <div class="emoji" id="revealEmoji">🎉</div>
            <div class="reveal-label" id="revealLabel">도착! 이곳은…</div>
            <h2 id="revealName">???</h2>
            <p class="addr" id="revealAddr"></p>
            <p class="desc" id="revealDesc"></p>
            <div class="meta" id="revealMeta"></div>
            <button class="btn-primary" id="revealNext">다음 비밀 장소로 →</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // TMAP SDK 동기 로드 — 앱키는 백엔드(/api/config)에서 받는다.
    // (jsv2 로더가 내부적으로 document.write를 쓰므로 파싱 시점에 심어야 한다)
    (function () {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', location.protocol + '//' + location.hostname + ':8080/api/config', false);
        xhr.send(null);
        var key = (JSON.parse(xhr.responseText).tmapAppKey || '').trim();
        if (!key) throw new Error('empty key');
        document.write('<script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey='
          + encodeURIComponent(key) + '"><\/script>');
      } catch (e) { window.__tmapSdkFailed = true; }
    })();
  </script>
  <script src="js/common.js?v=22"></script>
  <script src="js/map.js?v=22"></script>
</body>
</html>
