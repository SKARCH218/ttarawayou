<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>미스터리 트립 — 예산 입력</title>
  <link rel="stylesheet" href="css/style.css?v=21" />
</head>
<body>
  <div class="phone">
    <div class="app">
      <div class="screen">
        <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
          <p class="brand">Mystery Trip · Korea</p>
          <h1 class="title">예산만 알려주세요,<br />목적지는 비밀이에요</h1>
          <p class="subtitle">지금 있는 곳 주변으로, AI가 예산에 맞춰<br />여행을 설계합니다. 어디로 가는지는… 비밀 🤫</p>

          <div class="card">
            <div class="field">
              <label>총 예산 <small style="color:#6f6a9c;">(숫자를 누르면 직접 입력)</small></label>
              <div class="budget-display">
                <span class="budget-num" id="budgetValue" title="눌러서 직접 입력">300,000</span>
                <span class="unit-inline">토큰</span>
              </div>
              <input type="range" class="budget-slider" id="budgetSlider"
                     min="50000" max="500000" step="10000" value="300000" />
              <div class="slider-scale">
                <span>50,000</span>
                <span id="maxLabel">—</span>
              </div>
              <div class="wallet-row">
                <span>🪙 보유 토큰: <b id="walletBalance">불러오는 중…</b></span>
                <button type="button" class="charge-btn" id="chargeBtn">⚡ 충전 (테스트)</button>
              </div>
            </div>

            <div class="field">
              <label>여행 일수</label>
              <div class="stepper">
                <button type="button" data-step="days" data-delta="-1">−</button>
                <div class="stepper-value"><span id="daysValue">2</span><small>일</small></div>
                <button type="button" data-step="days" data-delta="1">＋</button>
              </div>
            </div>

            <div class="field" style="margin-bottom:4px;">
              <label>인원</label>
              <div class="stepper">
                <button type="button" data-step="people" data-delta="-1">−</button>
                <div class="stepper-value"><span id="peopleValue">2</span><small>명</small></div>
                <button type="button" data-step="people" data-delta="1">＋</button>
              </div>
            </div>
          </div>

          <div class="error-box" id="errorBox"></div>

          <div style="margin-top:20px;">
            <button class="btn-primary" id="createBtn">🔮 미스터리 플랜 만들기</button>
          </div>

          <p class="geo-note">
            <span class="dot">📡</span>
            <span>현재 위치 주변으로 여행을 설계하기 위해 위치 권한을 요청합니다.
            지도 따라가기도 GPS로 동작하므로 위치 권한을 허용해 주세요.
            (위치를 못 얻으면 기본 지역 기준으로 만들어집니다)</span>
          </p>
        </div>
      </div>

      <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p><b>AI가 미스터리 여행을 설계하는 중…</b><br />
        <span id="loadingMsg">예산을 배분하고 있어요</span></p>
      </div>
    </div>
  </div>

  <script src="js/common.js?v=21"></script>
  <script src="js/budget.js?v=21"></script>
</body>
</html>
